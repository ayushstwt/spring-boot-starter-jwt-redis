spring.application.name=spring-boot-starter-jwt-redis

# MySql Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/redis_spring
spring.datasource.username=root
spring.datasource.password=ayush@123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#logging configuration
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

# JWT Configuration
jwt.secret=your_jwt_secret_key
jwt.expiration=3600

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
